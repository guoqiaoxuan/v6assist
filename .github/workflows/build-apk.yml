name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Probe Android SDK / NDK
        id: sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          ls "$ANDROID_HOME" || true
          echo "--- ndk dir ---"
          ls "$ANDROID_HOME/ndk" || true
          NDK="$ANDROID_NDK_LATEST_HOME"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          fi
          echo "resolved NDK=$NDK"
          test -d "$NDK"
          echo "ndk=$NDK" >> "$GITHUB_OUTPUT"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"

      - name: Restore cached libbox.aar
        id: libbox-cache
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: libbox-v1.14.3-arm64-r1

      - name: Checkout sing-box v1.14.3
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.14.3 https://github.com/SagerNet/sing-box.git "$RUNNER_TEMP/sing-box"

      - name: Install gomobile (sagernet fork, 与 sing-box 匹配)
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          ls -l "$(go env GOPATH)/bin"

      - name: Build libbox.aar (arm64 only)
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/sing-box
        run: |
          set -x
          export PATH="$(go env GOPATH)/bin:$PATH"
          go run ./cmd/internal/build_libbox -target android -platform android/arm64
          ls -l libbox*.aar

      - name: Copy libbox.aar into app
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/libs
          cp "$RUNNER_TEMP"/sing-box/libbox.aar app/libs/libbox.aar
          ls -l app/libs

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          gradle --no-daemon assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find . -name "*.apk" -type f -print
          cp app/build/outputs/apk/debug/*.apk out/v6assist-debug.apk
          ls -l out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: v6assist-debug-apk
          path: out/v6assist-debug.apk
          if-no-files-found: error
          retention-days: 14
